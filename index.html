<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#194b3a">
  <title>Bookrats</title>
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem('bookrats.theme'); } catch {}
      if (!['light', 'dark'].includes(theme)) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#171d1a' : '#fafbf9';
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile.css?v=4">
  <link rel="stylesheet" href="theme.css?v=4">
</head>
<body>
  <div id="app"></div>
  <dialog id="modal"><form id="modalForm"><div id="modalBody"></div></form></dialog>
  <div id="toast" role="status"></div>
  <input id="fileInput" type="file" accept="application/json,.json" hidden>
  <script src="firebase-config.js?v=9" defer></script>
  <script src="auth.bundle.js?v=9" defer></script>
  <script src="app.js?v=9" defer></script>
</body>
