<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="same-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#194b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bookrats">
  <title>Bookrats</title>
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem('bookrats.theme'); } catch {}
      if (!['light', 'dark'].includes(theme)) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#171d1a' : '#fafbf9';
    })();
  </script>
  <link rel="icon" type="image/png" href="brand/app-icon.png">
  <link rel="apple-touch-icon" href="brand/app-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=14">
  <link rel="stylesheet" href="mobile.css?v=15">
  <link rel="stylesheet" href="theme.css?v=14">
</head>
<body>
  <div id="app"></div>
  <dialog id="modal"><form id="modalForm"><div id="modalBody"></div></form></dialog>
  <div id="toast" role="status"></div>
  <input id="fileInput" type="file" accept="application/json,.json" hidden>
  <script src="firebase-config.js?v=12" defer></script>
  <script src="auth.bundle.js?v=14" defer></script>
  <script src="app.js?v=14" defer></script>
</body>
